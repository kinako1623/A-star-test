<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRBot - 3D Floor Map</title>
  <style>
    /* ページ全体の基本スタイル */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f2f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    /* 3Dビューアを収める親フレーム */
    #viewer-container {
      position: relative;
      width: 100%;
      max-width: 80%; /* サイトに合わせて調整 */
      height: 80%;    /* サイトに合わせて調整 */
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden; /* CanvasやUIのはみ出しを防ぐ */
      border: 1px solid #ddd;
    }

    /* Three.jsのキャンバス */
    #app {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 操作パネルのフレーム（ガラスデザイン） */
    #ui-frame {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 50px;
      padding: 20px 8px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* 階数表示バッジ */
    #floor-badge {
      background: #333;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 縦型スライダーのカスタマイズ */
    #floor-slider {
      appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 8px;
      height: 300px;
      cursor: pointer;
      outline: none;
    }

    /* 補助テキスト（縦書き） */
    .slider-label {
      writing-mode: vertical-rl;
      font-size: 10px;
      color: #666;
      letter-spacing: 2px;
      margin-top: 5px;
      opacity: 0.7;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BZzDBYpp.js"></script>
</head>
<body>

  <h1>静高　校舎マップ</h1>

  <div id="viewer-container">
    
    <canvas id="app"></canvas>

    <div id="ui-frame">
      <div id="floor-badge">
        <span id="floor-label">1</span>F
      </div>

      <input 
        type="range" 
        id="floor-slider" 
        min="0" 
        max="4" 
        step="1" 
        value="0"
      >

      <div class="slider-label">FLOOR SELECT</div>
    </div>

  </div>

  <button id="fullscreen-btn" style="
    background: none;
    border: 1px solid #666;
    border-radius: 4px;
    cursor: pointer;
    padding: 5px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
  </svg>
</button>


</body>
</html>
