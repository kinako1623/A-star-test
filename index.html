<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>IRBot 3D Navigator</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #f4f4f9; }
    
    /* 親コンテナ：この枠内に全てを収める */
    #viewer-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 600px;
      margin: 0 auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      touch-action: none;
    }

    #app { width: 100%; height: 100%; display: block; }

    /* UIフレーム：右下に配置 */
    #ui-frame {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 60px;
      padding: 15px 5px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 100;
      user-select: none;
    }

    #floor-badge {
      background: #333; color: white;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 14px;
    }

    #floor-slider {
      appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 25px; height: 200px; cursor: pointer;
    }

    button {
      background: none; border: none; cursor: pointer; opacity: 0.6; padding: 5px;
    }
    button:active { transform: scale(0.9); }

    /* フルスクリーン時のスタイル補正 */
    #viewer-container:fullscreen { width: 100vw; height: 100vh; max-width: none; border-radius: 0; }
  </style>
  <script type="module" crossorigin src="./assets/index-E1bwr86-.js"></script>
</head>
<body>

  <div id="viewer-container">
    <canvas id="app"></canvas>

    <div id="ui-frame">
      <div id="floor-badge"><span id="floor-label">1</span>F</div>
      <input type="range" id="floor-slider" min="0" max="4" step="1" value="0">
      <button id="fullscreen-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
      </button>
    </div>
  </div>

</body>
</html>
