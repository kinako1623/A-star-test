<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <style>
    /* viewer-containerをレスポンシブに */
    #viewer-container {
      width: 100%;      /* 横幅いっぱい */
      height: 80vh;     /* 画面の高さの80%（スマホで操作しやすくするため） */
      max-height: 600px;
      position: relative;
      touch-action: none; /* ブラウザのデフォルトスクロールを防止 */
    }

    /* UIフレームをスマホ用に大きく・押しやすく */
    #ui-frame {
      right: 10px;      /* 少し端に寄せる */
      width: 60px;      /* タップしやすく少し太く */
      padding: 15px 5px;
    }

    /* スライダーを太くして指で掴みやすく */
    #floor-slider {
      width: 25px;      /* つまみだけでなくレールも少し太く */
      height: 200px;
      cursor: pointer;
    }

    /* タップ時の青い枠を消す */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CiJzBP_V.js"></script>
</head>
<body>

  <h1>静高　校舎マップ</h1>

  <div id="viewer-container">
    
    <canvas id="app"></canvas>

    <div id="ui-frame">
      <div id="floor-badge">
        <span id="floor-label">1</span>F
      </div>

      <input 
        type="range" 
        id="floor-slider" 
        min="0" 
        max="4" 
        step="1" 
        value="0"
      >

      <div class="slider-label">FLOOR SELECT</div>
    </div>

  </div>

  <button id="fullscreen-btn" style="
    background: none;
    border: 1px solid #666;
    border-radius: 4px;
    cursor: pointer;
    padding: 5px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
  </svg>
</button>


</body>
</html>
